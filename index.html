const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, " ").replace(/\s+/g, " ");
const has = (t, w) => new RegExp("(^|[^a-z])" + norm(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(s|x)?(?![a-z])").test(t);

// Score d'une liste de clés sur un texte : la clé la plus spécifique gagne (longueur cumulée).
function score(t, keys) {
  let best = 0;
  for (const k of keys) {
    const words = Array.isArray(k) ? k : [k];
    if (words.every(w => has(t, w))) best = Math.max(best, words.reduce((n, w) => n + norm(w).length, 0) + (words.length - 1) * 3);
  }
  return best;
}

function findZone(text) {
  const t = " " + norm(text) + " ";
  let best = null, bestScore = 0;
  for (const z of KB) { const s = score(t, z.keys); if (s > bestScore) { best = z; bestScore = s; } }
  // Seulement la région (« genou ») et rien de plus précis → on demande de préciser.
  let region = null, regionScore = 0;
  for (const [id, r] of Object.entries(REGIONS)) { const s = score(t, r.keys); if (s > regionScore) { region = id; regionScore = s; } }
  // Une zone précise de la même région l'emporte toujours (« entorse cheville », « crampe mollet »).
  if (region && REGIONS[region].ask && regionScore >= bestScore && !(best && best.region === region)) return { region };
  return best ? { zone: best } : null;
}

function readContext(text) {
  const t = " " + norm(text) + " ";
  return CONTEXT.filter(c => c.keys.some(k => has(t, k)));
}

// ─── UI ──────────────────────────────────────────────────────────────────────
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const wait = ms => new Promise(r => setTimeout(r, ms));
const scroll = () => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

function add(role, html) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = (role === "bot" ? '<div class="avatar small">A</div>' : "") + '<div class="bubble">' + html + "</div>";
  chat.appendChild(el);
  scroll();
  return el;
}

async function botSay(html, delay = 900) {
  const t = add("bot", '<span class="typing" aria-hidden="true"><i></i><i></i><i></i></span><span class="thinking">' + pick(THINKING) + "</span>");
  await wait(delay);
  t.querySelector(".bubble").innerHTML = html;
  scroll();
}

// Puces : libellé affiché → texte envoyé (le texte envoyé doit retrouver la bonne zone).
function chips(items) {
  const el = document.createElement("div");
  el.className = "chips";
  for (const it of items) {
    const [label, say] = Array.isArray(it) ? it : [it, it];
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.onclick = () => { el.remove(); ask(say, label); };
    el.appendChild(b);
  }
  chat.appendChild(el);
  scroll();
}

const REGION_CHIPS = [["Genou", "genou"], ["Cheville", "cheville"], ["Pied", "pied"], ["Mollet", "mollet"], ["Tendon d'Achille", "achille"],
  ["Tibia", "tibia"], ["Cuisse", "cuisse"], ["Hanche / fesse", "hanche"], ["Dos", "dos"], ["Épaule", "epaule"], ["Coude / poignet", "bras"],
  ["Nuque", "nuque"], ["Ventre / côtes", "torse"], ["Partout", "partout"], ["Nulle part", "nulle part"]];

function subChips(region) {
  return KB.filter(z => z.region === region).map(z => [z.zone.replace(/^(le |la |les |l')/, "").replace(/^./, c => c.toUpperCase()), z.zone]);
}

function prescription(zone, ctx) {
  const e = pick(zone.exos), v = pick(VINS);
  const precis = ctx.filter(c => c.txt).map(c => c.txt);
  const quip = ctx.find(c => c.quip);
  const intro = zone.zone === "nulle part" ? "« Nulle part ». Je vois." :
    `Alors : <b>${zone.zone}</b>${precis.length ? ", " + precis.join(", ") : ""}. Je vois. Je vois très bien.`;
  return `<p>${intro}</p>${quip ? `<p>${quip.quip}</p>` : ""}
    <div class="card diag"><div class="label">Diagnostic (très sérieux)</div><div class="title">${zone.diag.t}</div><div class="why">${zone.diag.w}</div></div>
    <div class="card exo"><div class="label">Exercice</div><div class="title">${e.t}</div><div class="dose">${e.d}</div><div class="why">${e.w}</div></div>
    <div class="card vin"><div class="label">Accord vin</div><div class="title">${v.t}</div><div class="why">${v.w}</div></div>
    <div class="foot">${pick(FOOT)}</div>`;
}

let busy = false;
let lastCtx = [];   // le contexte (côté, moment…) est gardé quand on précise via les puces
async function ask(text, shown) {
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true;
  document.querySelectorAll(".chips").forEach(c => c.remove());
  add("user", (shown || text).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])));
  const ctx = readContext(text);
  const found = findZone(text);
  if (found && found.region) {
    lastCtx = ctx;
    await botSay(`<p>${REGIONS[found.region].ask}</p>`, 1000);
    chips(subChips(found.region));
  } else if (found) {
    await botSay(prescription(found.zone, ctx.length ? ctx : (shown ? lastCtx : [])), 1400 + Math.random() * 900);
    lastCtx = [];
  } else {
    await botSay("<p>Hmm. Je ne localise pas. Antonin aurait mis la main dessus tout de suite, mais moi je n'ai pas de mains.</p><p>C'est plutôt où ?</p>", 1100);
    chips(REGION_CHIPS);
  }
  busy = false; send.disabled = false;
  input.focus();
}

form.addEventListener("submit", e => { e.preventDefault(); const v = input.value; input.value = ""; ask(v); });
